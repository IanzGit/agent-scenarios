# 可选：复用原系统的 OpenAI-compatible 网关。凭据只读取环境变量。
- id: llm-pi-ai
  config:
    providers:
      mine-gateway:
        displayName: 煤矿模型网关
        api: openai-completions
        apiKeyEnv: WATER_HAZARD_MODEL_API_KEY
        baseURL: !!js process.env.WATER_HAZARD_MODEL_BASE_URL
        reasoning: off
        compat:
          supportsDeveloperRole: false
          thinkingFormat: chat-template
          chatTemplateKwargs:
            enable_thinking:
              $var: thinking.enabled
        models:
          - id: !!js process.env.WATER_HAZARD_MODEL_ID
            name: !!js process.env.WATER_HAZARD_MODEL_ID
            contextWindow: !!js Number(process.env.WATER_HAZARD_MODEL_CONTEXT_WINDOW || 131072)
            maxTokens: !!js Number(process.env.WATER_HAZARD_MODEL_MAX_TOKENS || 32768)
            reasoningEfforts:
              off:
              high: high
- id: agent-default-model
  config:
    provider: mine-gateway
    model: !!js process.env.WATER_HAZARD_MODEL_ID
