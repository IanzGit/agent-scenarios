- insert:
    - id: charts
      name: dsh-agent-charts
    - id: hydrology-query-results
      name: dsh-agent-scenarios/hydrology-monitoring/results
    - id: preset-water-hazard
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: water-hazard
        order: 0
        plugins:
          - id: water-hazard-tools
            name: dsh-agent-scenarios/water-hazard
          - id: chart-tools
            name: dsh-agent-charts/tools
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: >-
                你是煤矿水害监测分析助手，使用中文回答。处理总体监测、报警统计或水文趋势问题前，
                必须先加载对应 skill，再按技能调用业务工具。报告仅依据本轮真实工具结果，
                明确区分无事件、缺少数据和请求失败。按技能要求使用工具返回的汇总与完整 Markdown 表格，
                再按技能要求调用对应图表工具，使用本轮返回的数据来源ID，图表在最终回答正文对应段落中展示，成功后必须独立一行输出 [图表:真实chart_id] 引用，不能编造ID或输出图表配置。
                不编造数字，不输出图表配置，不调用未提供的业务能力。日期按工具配置解释。
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
    - id: preset-hydrology-monitoring
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: hydrology-monitoring
        name: 水文监测查数
        description: 水文监测点、实时状态、历史趋势及预警报警查询分析。
        order: 1
        plugins:
          - id: hydrology-monitoring
            name: dsh-agent-scenarios/hydrology-monitoring
          - id: query-hydrology
            name: '@deepseek-ai/dsh-tool-subagent'
            config:
              provider: spawn
              toolName: query_hydrology
              agentPreset: hydrology-query
              maxDepth: 1
          - id: chart-tools
            name: dsh-agent-charts/tools
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: >-
                你是水文监测查数助手，使用中文。先加载最匹配的一个 skill，按技能一次性列出查询小任务。
                每项小任务必须独立调用 query_hydrology，prompt 写全对象、指标、时间、地点和排除条件；
                严格保留技能各项范围；仅历史趋势规定默认日期时，不给未限定时间的事件任务添加最近30天等条件。
                不依赖子智能体读取父会话或 skill。每次最多启动三个独立查询，依赖任务取得上游结果后再启动。
                官方委派立即返回子会话ID，之后由运行时通知完成；只剩等待时结束本次响应，不轮询或宣称报告已完成。
                收到完成通知就将对应ID标记为已结束；通知里的 closing message 可能是纠错前的说明或没有正文，不能据此判断失败或重复委派。
                查询状态只以 get_hydrology_query_result 返回的 outcome 为准；只有该工具确认真实失败后才决定是否重新查询。
                没有下游依赖时，不在每项完成通知后预读结果或验证 closing message；等待所有查询结束再统一读取，避免重复明细挤占上下文。
                全部查询完成后，在最终展示轮统一调用 get_hydrology_query_result 读取所需结果，再绘图并成文，
                避免跨轮使用已过期的图表来源。先前为依赖读取的结果在展示轮重新读取。
                无匹配技能的简单查数也必须调用查询子智能体。报告仅依据真实查询结果和确定性统计，
                明确区分无记录、失败和缺少字段；无事件不能等同于运行正常。
                成文前核对实际查询条件；无事件不能推出阈值未触发、设备正常或系统安全，零值不能推断停产、无排水或正常工况。
                未提供阈值、生产工况、应有采样频率和完整性依据时，只陈述观测值、统计和数据缺口，不评价安全、管理成效或数据完整性。
                使用现有图表工具和本轮来源目录，每张成功图表在对应正文段落后独立一行输出 [图表:真实chart_id]，
                每个ID引用一次，不编造数据或图表ID，不输出图表配置。技能固定日期不会被真实系统日期覆盖。
    - id: preset-hydrology-query
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: hydrology-query
        name: 水文查询子智能体
        description: 仅供水文监测查数场景委派单个完整查询任务。
        order: 2
        plugins:
          - id: hydrology-query-child
            name: dsh-agent-scenarios/hydrology-monitoring/query-child
- id: agent-preset-registry
  config:
    default: water-hazard
- id: tools
  config:
    mode: native
