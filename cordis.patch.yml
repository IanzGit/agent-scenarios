- insert:
    - id: charts
      name: dsh-agent-charts
    - id: agent-scenarios-client
      name: dsh-agent-scenarios
      config:
        clientOnly: true
    - id: hydrology-query-results
      name: dsh-agent-scenarios/hydrology-monitoring/results
    - id: hydrology-parent-tasks
      name: dsh-agent-scenarios/hydrology-monitoring/parent-tasks
    - id: preset-water-hazard
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: water-hazard
        order: 0
        plugins:
          - id: water-hazard-tools
            name: dsh-agent-scenarios/water-hazard
          - id: chart-tools
            name: dsh-agent-charts/tools
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: >-
                你是煤矿水害监测分析助手，使用中文回答。处理总体监测、报警统计或水文趋势问题前，
                必须先加载对应 skill，再按技能调用业务工具。报告仅依据本轮真实工具结果，
                明确区分无事件、缺少数据和请求失败。按技能要求使用工具返回的汇总与完整 Markdown 表格，
                再按技能要求调用对应图表工具，使用本轮返回的数据来源ID，图表在最终回答正文对应段落中展示，成功后必须独立一行输出 [图表:真实chart_id] 引用，不能编造ID或输出图表配置。
                不编造数字，不输出图表配置，不调用未提供的业务能力。日期按工具配置解释。
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
    - id: preset-hydrology-monitoring
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: hydrology-monitoring
        name: 水文监测查数
        description: 水文监测点、实时状态、历史趋势及预警报警查询分析。
        order: 1
        plugins:
          - id: hydrology-monitoring
            name: dsh-agent-scenarios/hydrology-monitoring
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: >-
                你是水文监测分析助手，使用中文。先加载最匹配的一个 skill，再将全部查询、依赖、图表意图和报告章节一次性提交给 query_hydrology({plan})。
                每个查询有唯一id和独立完整的prompt，写全对象、指标、时间、地点及排除条件；depends_on和inputs只声明真实依赖。
                父任务服务负责并发、等待、重试和绘图，不逐个派发子智能体，不轮询，不根据closing message判断查询状态。
                收到 hydrology-task-ready 集中通知后，调用 get_hydrology_query_result({task_id}) 读取真实结果，再调用 publish_hydrology_report({task_id, markdown}) 发布完整报告。
                普通助手回复不算发布；报告正文不在工具调用之间分段输出。最终Markdown从计划中的一级标题开始，按顺序包含全部二级章节。
                每张成功图表在相应分析段落后独立一行写 [图表:真实chart_id]，每个ID引用一次；无数据或失败图表不引用。
                一项查询失败不影响独立查询；按工具返回状态明确说明失败、无记录和缺少字段，不编造数据或图表ID。
                用户未明确要求取消时，不取消正在执行的业务任务。发布后不能覆盖报告，修订需新的用户请求及计划。
                成文前核对实际条件；无事件不能推断阈值未触发、设备正常或系统安全；缺少应有采样频率等依据时不评价数据完整性。
                只按实际统计陈述，不推断故障原因、生产工况或未来变化；技能固定日期不会被真实系统日期覆盖。
    - id: preset-hydrology-query
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: hydrology-query
        name: 水文查询子智能体
        description: 仅供水文监测查数场景委派单个完整查询任务。
        order: 2
        plugins:
          - id: hydrology-query-child
            name: dsh-agent-scenarios/hydrology-monitoring/query-child
- id: agent-preset-registry
  config:
    default: water-hazard
- id: tools
  config:
    mode: native
